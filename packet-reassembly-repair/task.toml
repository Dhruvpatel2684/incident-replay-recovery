tags = ["tcp", "packet-reassembly", "fragmentation", "network-protocols", "session-reconstruction", "debugging"]
difficulty_explanation = "Requires understanding TCP-like packet fragmentation, sequence number arithmetic, and session reassembly. Bugs span fragment_parser.py, reassembly_engine.py, and session_writer.py with cross-file dependencies: the session checksum depends on correct byte ordering which depends on both fragment offset parsing AND retransmission deduplication, creating an interlocking fix requirement. Several bugs are disguised as optimizations with misleading comments."
solution_explanation = "The oracle re-implements the full reassembly pipeline with corrected logic: fixes fragment offset extraction for FIN packets, restores full payload length calculation, resets reassembly buffers between sessions, deduplicates retransmissions by keeping first-seen not last-seen, computes gap count before merging adjacent fragments, sorts fragments by offset for deterministic checksum, and corrects RTT estimation using proper timestamp delta."
verification_explanation = "Tests validate both output files: correct reassembled payload count (8 sessions), retransmission detection (5 duplicates), checksum determinism, contiguous byte ranges, proper session boundaries, and correct total_bytes_reassembled. Six test functions cover orthogonal correctness properties with interlocking dependencies."
expert_time_estimate_hours = 2.5

[task]
name = "packet-reassembly-repair"
description = "Debug a broken packet fragment reassembler that reads captured network fragments, reconstructs sessions from out-of-order pieces using sequence numbers, detects retransmissions, and produces incorrect session reconstruction output due to interacting bugs across parser, reassembly engine, and session writer modules."

difficulty_explanation = "7 interacting bugs across 3 modules (flow_tracker.py, reassembly_engine.py, integrity_checker.py). Key difficulty: Bug 4 (>= in completeness) masks Bug 3 (byte count -1), so fixing one without the other causes previously-passing tests to fail. Bug 1 (implicit dups counted as retransmits) cascades into per-flow counts and RTT. The checksum bug requires both sorted iteration AND correct upstream values. Bugs are disguised with plausible comments about 'TLS close_notify overhead' and 'TSO segment alignment' rather than obvious arithmetic errors. 5-module pipeline requires understanding data flow across stages."
solution_explanation = "Fix Bug 1: in flow_tracker.py, change implicit duplicate handling to increment duplicate_count instead of retransmit_count and remove RTT recording. Fix Bug 3: in reassembly_engine.py _compute_payload_total, remove the <=3 fragment TLS correction. Fix Bug 4: change >= to == in completeness check. Fix Bug 5: in integrity_checker.py, use total_retransmits/(total_frags+total_retransmits) for loss rate. Fix Bug 6: sort keys in checksum computation. Bugs 2 and 7 are automatically fixed when Bug 1 is fixed."
verification_explanation = "15 test functions in 5 classes covering orthogonal properties: structure (4 tests, pass even buggy), retransmissions (3 tests, require Bug 1 fix), byte counts (3 tests, require Bug 3 fix), completeness (3 tests, require Bugs 3+4 together), metrics (1 test, requires Bug 5 fix + Bug 1 fix for correct denominator), integrity (1 test, requires ALL fixes). NOP: 8 pass / 7 fail. Oracle: 15 pass."
expert_time_estimate_hours = 3.0


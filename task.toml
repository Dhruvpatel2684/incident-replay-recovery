difficulty_explanation = "Requires understanding register allocation via graph coloring, reasoning about corrupted data formats, identifying multiple corruption types from symptoms, and writing a multi-step repair script that restores semantic consistency across interference graph and live range data."
solution_explanation = "The repair script removes phantom nodes (nodes with no live range data), deduplicates edges in the adjacency list, fixes shifted live ranges (end_instruction exceeding max_instruction_index by subtracting 2), and recomputes missing interference edges by checking live range overlaps. After repair, the correct DSatur engine produces conflict-free register assignments."
verification_explanation = "Tests verify: output files exist with valid structure, correct virtual register count in output, no register conflicts in assignments, no phantom registers, valid physical register names, correct node count matches live ranges, no duplicate edges, all live range overlaps have corresponding edges, no ranges exceed max_instruction_index, exact spill count of 0, exact edge count of 110, and register class constraints respected."
expert_time_estimate_hours = 2.5

[task]
name = "regalloc-interference-repair"
description = "Repair corrupted interference graph and live range data so that a correct DSatur graph coloring register allocator produces valid conflict-free assignments"

[task.difficulty]
level = "hard"
reasoning = "Four interacting data corruptions require understanding graph coloring semantics, live range analysis, and the relationship between interference edges and overlapping live ranges"

[task.runtime]

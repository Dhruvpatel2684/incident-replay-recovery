difficulty_explanation = "Requires understanding git-style content-addressable storage, SHA-1 hash computation with type-length headers, and cascading hash dependencies where fixing one object invalidates dependent objects. The agent must reason about the full dependency chain: blobs → trees → commits → refs."
solution_explanation = "The repair script reads source files to recompute correct blob hashes, rebuilds tree objects with correct references, rebuilds commit objects with correct tree hashes, fixes the HEAD reference to point to the latest commit, and rebuilds the index with valid blob hashes. The key insight is that all repairs must cascade: fixing blobs changes tree content which changes tree hash which changes commit content which changes commit hash which changes what HEAD must reference."
verification_explanation = "Tests verify the repaired store by checking: all object filenames match SHA-1 of content, correct object counts by type, tree references resolve to existing objects, commit tree/parent references are valid, HEAD points to latest commit, index maps to existing blobs, and blob content matches source files. An integrity report must show all checks passing."

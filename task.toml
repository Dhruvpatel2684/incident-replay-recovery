tags = ["raft", "consensus", "distributed-systems", "log-replication", "state-machine", "debugging"]
difficulty_explanation = "Requires understanding Raft consensus protocol mechanics (elections, log replication, commits) and tracing data flow across 3 interacting modules. Multiple bugs are spread across log_parser.py, state_machine.py, and output_formatter.py with cross-file interactions. Critical traps: (1) the committed_entries slice uses exclusive upper bound requiring +1 adjustment, (2) commit_index is only propagated to the leader not followers with a misleading comment justifying this as intentional, (3) the consistency hash formula includes len(committed_entries) creating a coupling where all state bugs must be fixed simultaneously for the hash to match. These interlocking traps mean partial fixes produce cascading failures across multiple tests."
solution_explanation = "The oracle re-implements the full replay pipeline with corrected logic: fixes term extraction, restores timestamp precision, resets vote counters, counts commits per-event, uses prev_log_idx+1 for positioning, sorts nodes AND preserves the len(committed_entries) field in hash computation, corrects quorum threshold, propagates commit_index to ALL nodes (not just leader), and uses log[:commit_index+1] for inclusive committed entry slicing."
verification_explanation = "Tests validate both output files against exact expected values: correct commit count (6), split vote detection (1), consistency hash determinism (formula includes committed entry count), uniform log lengths and commit indices across all nodes, proper committed entry sequences excluding uncommitted entries, and correct total_events_processed sum. Six test functions cover orthogonal correctness properties with interlocking dependencies."
expert_time_estimate_hours = 3.0

[task]
name = "consensus-log-repair"
description = "Debug a broken Raft consensus log replayer that processes cluster communication logs and produces incorrect cluster state summaries due to interacting bugs across parser, state machine, and output formatter modules."

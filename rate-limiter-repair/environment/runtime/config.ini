[bucket]
capacity = 20
refill_rate = 5
refill_interval_ms = 1000

[window]
size_ms = 5000
max_requests = 30
granularity_ms = 500

[classifier]
api_pattern = ^/api/v[0-9]+/
static_pattern = ^/static/
ws_pattern = ^/ws/
health_pattern = ^/health

[policy]
mode = strict
burst_allowance = 3
enforcement = all

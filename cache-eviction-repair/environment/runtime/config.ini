[tiers]
active_tiers = hot,warm,cold, archive
data_directory = /app/runtime/data
output_directory = /app/runtime/output

[eviction]
algorithm = lru
max_capacity = 200
window_size = 20
staleness_threshold_sec = 7200

[eviction.lru]
max_capacity = 50
staleness_threshold_sec = 3600
weight_decay = 0.85
promote_on_hit = true

[scoring]
base_priority = 100
frequency_boost = 10
recency_weight = 0.7

[tier.hot]
ttl_sec = 600
max_entries = 30
priority_floor = 80

[tier.warm]
ttl_sec = 1800
max_entries = 50
priority_floor = 40

[tier.cold]
ttl_sec = 7200
max_entries = 80
priority_floor = 10

[tier.archive]
ttl_sec = 86400
max_entries = 200
priority_floor = 1

[drift]
comparison_mode = strict
ignore_order_fields = dns_servers,tags,ntp_servers
type_coerce_fields = port,listen_port,max_connections,timeout_seconds,workers,max_wal_senders,max_tasks_per_child,save_interval,max_disk_gb,retention_days

[compliance]
include_decommissioned = false
score_precision = 2

[remediation]
auto_plan = true
max_actions_per_node = 50

[output]
output_path = /app/runtime/output
snapshot_filename = drift_report.jsonl
compliance_filename = compliance_summary.json

[scheduler]
name = priority-scheduler
version = 2.1.0
max_concurrent = 8
batch_window = 60
allowed_groups = batch,realtime,maintenance, analytics

[scheduler.execution]
batch_window = 15
retry_limit = 3
timeout_multiplier = 1.5

[scheduler.priorities]
critical = 100
high = 75
medium = 50
low = 25

[logging]
level = INFO
output_dir = /app/runtime/output

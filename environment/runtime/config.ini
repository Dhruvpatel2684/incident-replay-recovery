[registers]
# Available physical registers for allocation
physical_registers = r0,r1,r2,r3,r4,r5,r6,r7
num_physical_registers = 8

[program]
# Maximum instruction index in the compiled program
max_instruction_index = 120
# Total number of expected virtual registers (excluding phantoms)
num_virtual_registers = 30

[spill]
# Cost model for spilling decisions
base_spill_cost = 10
loop_depth_multiplier = 3
# Registers with usage_count below this threshold are cheaper to spill
low_usage_threshold = 4
low_usage_cost_factor = 0.5

[coloring]
# Graph coloring strategy: dsatur (degree of saturation)
strategy = dsatur
# Tie-breaking: highest_degree, lowest_index, highest_spill_cost
tie_break = highest_degree
# Maximum iterations for coalescing phase
max_coalesce_iterations = 50

[output]
assignments_file = /output/assignments.json
spill_report_file = /output/spill_report.json
diagnostics_file = /output/diagnostics.json

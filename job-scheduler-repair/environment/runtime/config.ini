[pools]
active_pools = compute,storage,network, gpu
data_directory = /app/runtime/data
output_directory = /app/runtime/output

[scheduling]
max_retries = 5
time_slice_ms = 500
batch_size = 15

[scheduling.deadlines]
max_retries = 2
deadline_weight = 0.8
starvation_threshold_ms = 3000

[priority]
levels = critical,high,normal,low
default_level = normal
preemption_enabled = true
